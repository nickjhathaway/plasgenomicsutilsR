# Run R CMD check (which runs the testthat suite) across operating systems and R
# versions. Standard r-lib/actions matrix workflow: macOS + Windows on R release, and
# Ubuntu on R devel / release / oldrel-1. setup-r-dependencies is biocViews-aware, so the
# Bioconductor Suggests (SNPRelate, gdsfmt, LEA) are installed and their code paths run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    # A full matrix leg runs in 5-10 min; the ceiling is for a cold dependency cache on
    # Windows. Without it a job that hangs in setup holds a runner for the 6-hour default,
    # and the run neither passes nor fails.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Installing R takes well under a minute; a cap here turns the occasional hung
      # download into a failure the retry workflow can act on, rather than a stalled job.
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 25
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # `_pkgdown.yml` is in .Rbuildignore, so R CMD check never sees it: a vignette or topic
  # missing from the index only surfaces when a tag fires the site deploy, long after the
  # commit that caused it. Validating the config needs neither the package nor its
  # dependencies, so this is a separate job rather than a step in the matrix above.
  pkgdown-config:
    runs-on: ubuntu-latest
    name: pkgdown config
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # check_pkgdown() builds the articles index, and that renders each vignette's title
      # and description through pandoc -- so it is needed even though nothing here builds
      # the site or the vignettes themselves.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with:
          use-public-rspm: true

      - name: Install pkgdown
        run: install.packages("pkgdown")
        shell: Rscript {0}

      - name: Check _pkgdown.yml against the package
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}
