url: https://nickjhathaway.github.io/plasgenomicsutilsR/

template:
  bootstrap: 5

reference:
- title: IBD results
  desc: Ingest the Python IBD tool outputs into one container.
  contents:
  - IbdResults
  - ibd_results
- title: Plots
  desc: Genome-wide and group-by-group IBD figures.
  contents:
  - plot_ibd_sharing_manhattan
  - plot_selection_manhattan
  - plot_ibd_tugofwar
  - plot_ibd_pairwise_group_heatmap
  - plot_pairwise_ibd_for_genes
  - plot_ibd_network
- title: Gene IBD-block overlap
  desc: Fraction of pairs whose IBD block overlaps a gene (block-based, not SNP-in-gene).
  contents:
  - gene_ibd_overlap
- title: Selection genes
  desc: Genes hit by an above-threshold IBD selection signal.
  contents:
  - pos_selection_genes
- title: Population structure
  desc: PCA / UMAP and sNMF admixture from genotypes, wrapped in one R6 workspace.
  contents:
  - PopStructure
  - run_ld_prune
  - pop_structure
  - plot_pca
  - plot_umap
  - n_pcs_for_variance
  - run_snmf
  - snmf_best_k
  - snmf_q
  - admixture_order
  - plot_admixture
  - plot_structure_figure
  - load_pop_structure
  - example_pop_structure
- title: Population differentiation
  desc: >
    Per-SNP allele differentiation between metadata groups (Jost's D, Hedrick's G'st,
    Hudson's Fst), a group summary + triangle heatmap, a genome-wide track, and marker
    selection.
  contents:
  - pop_diff
  - jost_d
  - pop_diff_snps
  - pop_diff_matrix
  - pop_diff_table
  - plot_diff_heatmap
  - plot_diff_manhattan
  - top_differentiating_snps
- title: Colours
  desc: Colour-blind-friendly palettes and a shared level-to-colour map.
  contents:
  - meta_colors
  - color_palette
- title: Saving and sizing
  contents:
  - save_plot
  - pdf_device
  - plot_dims
- title: Genomic intervals
  desc: Overlap two BED-style interval tables (genes vs. core / paralog regions, ...).
  contents:
  - bed_intersect
- title: Example & reference data
  contents:
  - example_ibd_results
  - PF3D7_GENES
  - PF_EXAMPLE_DRUG_GENES
  - PF3D7_CORE_REGIONS
  - PF3D7_PARALOG_GENES
- title: Reference genome
  desc: Species- and assembly-specific facts, namespaced so the tools stay general.
  contents:
  - get_reference
  - available_references
  - normalise_chr
  - DEFAULT_REFERENCE
  - PF3D7_CORE_CHROM_LENGTHS_BP
  - PF3D7_BP_PER_CM

articles:
- title: Get started
  navbar: ~
  contents:
  - plasgenomicsutilsR
- title: Analyses
  navbar: Analyses
  contents:
  - ibd
  - population-structure
  - differentiation
