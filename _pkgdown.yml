url: https://nickjhathaway.github.io/plasgenomicsutilsR/

template:
  bootstrap: 5

reference:
- title: IBD results
  desc: Ingest the Python IBD tool outputs into one container.
  contents:
  - IbdResults
  - ibd_results
- title: Plots
  desc: Genome-wide and group-by-group IBD figures.
  contents:
  - plot_ibd_sharing_manhattan
  - plot_selection_manhattan
  - plot_ibd_tugofwar
  - plot_ibd_locus
  - plot_ibd_pairwise_group_heatmap
  - plot_pairwise_ibd_for_genes
  - plot_ibd_network
  - plot_ibd_pair_network
  - ibd_pair_clusters
  - ibd_pair_links
- title: Genome-wide IBD between groups
  desc: >
    The per-pair IBD fraction reduced to one row per pair of metadata groups, over every
    sample pair spanning them.
  contents:
  - pair_fraction_summary
- title: Gene IBD-block overlap
  desc: >
    Which pairs share a gene by IBD: the fraction per group pair (block-based, not
    SNP-in-gene), and the underlying pair-by-pair adjacency list with gene coverage.
  contents:
  - gene_ibd_overlap
  - gene_ibd_pairs
  - add_ibd_clusters
- title: Selection genes
  desc: Genes hit by an above-threshold IBD selection signal.
  contents:
  - pos_selection_genes
- title: Population structure
  desc: PCA / UMAP and sNMF admixture from genotypes, wrapped in one R6 workspace.
  contents:
  - PopStructure
  - load_genotypes
  - merge_genotypes
  - run_ld_prune
  - pop_structure
  - plot_pca
  - plot_umap
  - n_pcs_for_variance
  - run_snmf
  - snmf_best_k
  - snmf_q
  - snmf_cross_entropy
  - plot_snmf_cross_entropy
  - admixture_order
  - plot_admixture
  - plot_admixture_multi_k
  - plot_structure_figure
  - load_pop_structure
  - example_pop_structure
- title: Population differentiation
  desc: >
    Per-SNP allele differentiation between metadata groups (Jost's D, Hedrick's G'st,
    Hudson's Fst), a group summary + triangle heatmap, a genome-wide track, and marker
    selection.
  contents:
  - pop_diff
  - jost_d
  - pop_diff_snps
  - pop_diff_matrix
  - jost_d_matrix
  - pop_diff_table
  - plot_diff_heatmap
  - plot_jost_d_heatmap
  - plot_diff_manhattan
  - top_differentiating_snps
- title: Within-population diversity
  desc: >
    Nucleotide diversity (per accessible base pair), expected heterozygosity, Watterson's
    theta, Tajima's D and haplotype/multilocus-genotype diversity, genome-wide, per gene
    or in windows, for each metadata group.
  contents:
  - pop_diversity
  - tajima_d
  - tajima_d_pvalue
  - plot_diversity
- title: Linkage disequilibrium
  desc: >
    The multilocus index of association as a genome-wide measure of clonality, and the
    reader/plot for the r-squared decay curve computed by `plasgenomicsutils ld_decay`.
  contents:
  - ld_index
  - read_ld_decay
  - plot_ld_decay
- title: Selection scans
  desc: >
    Recent directional selection from extended haplotype homozygosity (iHS within a
    population, Rsb and XP-EHH between two), and long-term balancing selection from
    clustered allele frequencies (beta).
  contents:
  - parasite_haplotypes
  - subset_haplotypes
  - add_haplotype_markers
  - run_ihs
  - run_rsb
  - run_xpehh
  - ihs_windows
  - ihs_genes
  - plot_ihs
  - plot_ehh
  - ehh_candidates
  - plot_region_haplotypes
  - beta_score
  - beta_genes
  - plot_beta
  - selection_peaks
- title: Sequencing coverage QC
  desc: >
    Read the depth tables written by `plasgenomicsutils coverage_depth_stats` /
    `coverage_dropout_regions`, apply per-sample QC floors, and plot depth per sample,
    per chromosome, and the regions almost no sample amplifies.
  contents:
  - read_coverage
  - coverage_qc
  - plot_coverage_summary
  - plot_coverage_by_chrom
  - plot_coverage_dropout
- title: Within-host mixtures
  desc: >
    Read the per-site table from `plasgenomicsutils wsaf_profile` and draw each sample's
    heterozygous allele fractions, which separate a dominant clone with minor companions
    from a mixture of comparable strains -- two things one Fws value cannot tell apart.
  contents:
  - plot_wsaf
- title: Colours
  desc: >
    Colour-blind-friendly palettes, a shared level-to-colour map, and the check that
    shows -- rather than asserts -- how a figure's colours read under each dichromacy.
  contents:
  - meta_colors
  - color_palette
  - colour_blind_distance
  - color_blind_distance
  - plot_colour_blind_check
  - plot_color_blind_check
- title: Saving and sizing
  contents:
  - save_plot
  - pdf_device
  - plot_dims
- title: Genomic intervals
  desc: >
    Overlap two BED-style interval tables (genes vs. core / paralog regions, ...), label SNPs
    with what they fall in, and turn amino-acid positions into genomic intervals. All
    coordinates in the package follow one convention.
  contents:
  - annotate_snps
  - aa_intervals
  - snp_aa_positions
  - genomic_range_aa_positions
  - read_gff_cds
  - read_gff_features
  - ensembl_gff_url
  - ensembl_genome_url
  - ensembl_species
  - ENSEMBL_PROTISTS_RELEASE
  - bed_intersect
  - bed_subtract
  - bed_merge
  - write_bed
  - write_bed6
  - haplotype_samples
  - subset_genotypes
  - plasgenomicsutilsR-coordinates
- title: Tandem repeats
  desc: >
    Short tandem repeats a polymerase slips on: read a repeat finder's BED, flag runs by the
    period of their unit and their length, merge runs that flow into one another, and
    subtract the result from a set of targets.
  contents:
  - tandem_repeats
  - flag_tandem_repeats
  - merge_tandem_repeats
  - tandem_repeats_to_avoid
  - pf3d7_tandem_repeats
- title: Example & reference data
  contents:
  - example_ibd_results
  - PF3D7_GENES
  - PF_EXAMPLE_DRUG_GENES
  - PF3D7_CORE_REGIONS
  - PF3D7_PARALOG_GENES
- title: Reference genome
  desc: Species- and assembly-specific facts, namespaced so the tools stay general.
  contents:
  - get_reference
  - available_references
  - normalise_chr
  - DEFAULT_REFERENCE
  - PF3D7_CORE_CHROM_LENGTHS_BP
  - PF3D7_BP_PER_CM

articles:
- title: Get started
  navbar: ~
  contents:
  - plasgenomicsutilsR
- title: Analyses
  navbar: Analyses
  contents:
  - ibd
  - population-structure
  - differentiation
  - diversity-and-selection
  - amino-acid-coordinates
- title: Working with the data
  navbar: Working with the data
  contents:
  - cohorts-and-subsets
  - filling-in-missed-calls
  - tandem-repeats
  - coverage-qc
